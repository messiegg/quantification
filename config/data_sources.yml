storage:
  raw_dir: data/raw
  curated_dir: data/curated
  features_dir: data/features
  snapshots_dir: data/snapshots
  report_dir: reports
  duckdb_path: data/curated/research.duckdb

cache:
  enabled: true
  format: parquet
  compression: zstd
  clear_on_run: true
  directories:
    - data/raw/akshare
    - data/raw/adata

retry:
  attempts: 3
  backoff_seconds: 1.5

defaults:
  adjust: qfq
  trading_days_per_year: 252
  stock_list_source_order:
    - akshare
    - baostock
  price_source_order:
    - baostock
    - akshare
    - efinance
  valuation_source_order:
    - baostock
    - akshare
  financial_source_order:
    - adata
    - akshare
    - baostock
  st_flag_source_order:
    - akshare
    - baostock
    - efinance
  market_cap_source_order:
    - efinance
    - akshare
    - baostock
  industry_source_order:
    - akshare

strict_run:
  price_history_start_date: 2021-01-01
  financial_history_start_date: 2020-01-01
  blocker_dir: reports/strict
  benchmark_index_market_hints:
    - sh
    - sz

tdx:
  local_dirs: []
  pytdx_hosts:
    - [招商证券深圳行情, 119.147.212.81, 7709]
    - [华泰证券上海行情, 101.227.73.20, 7709]
    - [中信证券深圳行情, 59.173.18.140, 7709]
    - [广发证券广州行情, 59.42.241.68, 7709]

jqdata:
  enabled_if_env: true
  username_env: JQDATA_USERNAME
  password_env: JQDATA_PASSWORD

adata:
  enabled: true

akshare:
  enabled: true
  valuation_endpoint: stock_zh_valuation_baidu
  industry_daily_endpoint: index_analysis_daily_sw
  industry_info_endpoints:
    - sw_index_first_info
    - sw_index_second_info
    - sw_index_third_info
  industry_members_endpoints:
    - sw_index_third_cons
    - index_component_sw

baostock:
  enabled: true
  fields:
    - date
    - code
    - open
    - high
    - low
    - close
    - volume
    - amount
    - turn
    - peTTM
    - pbMRQ
    - psTTM
    - pcfNcfTTM
    - isST

efinance:
  enabled: true
  price_fallback_only: true
  base_info_batch_size: 30
