name: ci

on:
  push:
  pull_request:

jobs:
  layer1-light-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Layer 1 lightweight tests
        run: python -m pytest -q -m "not data_required and not full_backtest"

  layer2-report-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Layer 2 release guard
        run: python scripts/run_release_guard.py --ci --as-of-date 2026-05-04
